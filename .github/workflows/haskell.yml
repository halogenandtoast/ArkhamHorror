name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./backend

jobs:
  build:
    name: stack / ghc ${{ matrix.ghc }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        stack: ["3.7.1"]
        ghc: ["9.14.1"]

    steps:
    - uses: actions/checkout@v3
    - uses: haskell-actions/setup@v2
      name: Setup Haskell Stack
      with:
        ghc-version: ${{ matrix.ghc }}
        stack-version: ${{ matrix.stack }}

    - name: Cache
      uses: actions/cache@v3
      env:
        cache-name: cache-stack
      with:
        path: ~/.stack
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.stack-work') }}-${{ hashFiles('**/stack.yaml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install pcre
      run: |
        sudo apt-get install -y libpcre3 libpcre3-dev
    - name: Install dependencies
      run: |
        stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks --only-dependencies
    - name: Build
      run: stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks cards-discover && stack build --system-ghc --test --no-run-tests --bench --no-run-benchmarks
    - name: Run tests
      run: stack test --system-ghc

    # Catches a card def with no implementation registered in the
    # hand-maintained allAssets/allEvents/allSkills lists. That failure is a
    # runtime `error "Unknown asset"`, so neither the build nor the spec suite
    # can see it. Scoped to this one invariant: validate's other checks compare
    # against backend/data/cards.json, which lags new cycles by months.
    - name: Check card implementations
      run: stack exec --system-ghc validate -- implementations
