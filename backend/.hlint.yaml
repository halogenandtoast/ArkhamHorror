---
- ignore: {name: "Redundant do", within: spec}
- ignore: {name: "Eta reduce"}
- ignore: {name: "Use list comprehension"}
- ignore: {name: "Reduce duplication"}
- ignore: {name: "Use fmap"}  # we use classy prelude so this would be in error
- ignore: {name: "Avoid restricted function", within: Application}
- ignore: {name: "Use ."}  # commonly broken or less readable
- ignore: {name: "Use &&"}  # we like "and" at 3+ elements
- ignore: {name: "Use ||"}  # we like "or" at 3+ elements
- ignore: {name: "Use on once"} # esqueleto

# Custom Warnings
- warn: {lhs: mapM, rhs: traverse}
- warn: {lhs: mapM_, rhs: traverse_}
- warn: {lhs: forM, rhs: for}
- warn: {lhs: forM_, rhs: for_}
- warn: {lhs: return, rhs: pure}

# Specify additional command line arguments
- arguments:
  - -XBangPatterns
  - -XNamedFieldPuns
  - -XTupleSections
  - -XBlockArguments
  - -XDataKinds
  - -XDeriveAnyClass
  - -XDeriveFoldable
  - -XDeriveFunctor
  - -XDeriveGeneric
  - -XDeriveLift
  - -XDeriveTraversable
  - -XDerivingStrategies
  - -XFlexibleContexts
  - -XFlexibleInstances
  - -XGADTs
  - -XGeneralizedNewtypeDeriving
  - -XLambdaCase
  - -XMultiParamTypeClasses
  - -XNoImplicitPrelude
  - -XNoMonomorphismRestriction
  - -XOverloadedStrings
  - -XRankNTypes
  - -XRecordWildCards
  - -XScopedTypeVariables
  - -XStandaloneDeriving
  - -XTypeApplications
  - -XTypeFamilies
  - -XImportQualifiedPost
  - -XPatternSynonyms
  - -XOverloadedRecordDot

- modules:
  - {name: [Data.Set], as: Set}
  - {name: [Data.Map], as: Map}
  - {name: [Data.HashSet], as: HashSet}
  - {name: [Data.HashMap.Strict], as: HashMap}
  - {name: [Data.Text], as: T}
  - {name: [Data.Text.Encoding], as: T}
  - {name: [Data.Text.IO], as: T}
  - {name: [Data.Text.Lazy], as: TL}
  - {name: [Data.Text.Lazy.Encoding], as: TL}
  - {name: [Data.Text.IO.Lazy], as: TL}
  - {name: [Data.ByteString], as: BS}
  - {name: [Data.ByteString.Lazy], as: BSL}
  - {name: [Data.ByteString.Char8], as: BS8}
  - {name: [Data.ByteString.Lazy.Char8], as: BSL8}
  - {name: [Data.List.NonEmpty], as: NE}
  - {name: [Data.Sequence], as: Seq}

# `modifySelf` stamps `modifierPrinted`, which asserts the card's own text
# always reads this -- so the client hides it as a restatement. A condition
# OUTSIDE the call makes that a lie: the modifier is there only because the
# condition holds, which is exactly what the player needs told. Carrying a
# number saves it (the numeral is the news), but a flag-only one vanishes.
#
# This was missed by hand twice. Use `modifySelfWhen` where the condition can
# be passed, `modifySelfConditional` where it cannot (a `for_` over a Maybe, a
# guard fused into the list, an enclosing `whenM`).
- warn:
    name: Use modifySelfWhen
    lhs: "when c (modifySelf a m)"
    rhs: "modifySelfWhen a c m"
- warn:
    name: Use modifySelfWhen
    lhs: "unless c (modifySelf a m)"
    rhs: "modifySelfWhen a (not c) m"
- warn:
    name: Use modifySelfWhenM
    lhs: "whenM c (modifySelf a m)"
    rhs: "modifySelfWhenM a c m"
