<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AH3e Dev Viewer</title>
<style>
  :root { --bg:#f6f4ef; --panel:#fff; --ink:#1d1b18; --muted:#6b665d; --line:#ddd6c8; --accent:#5b3fa0; --doom:#b3261e; --clue:#1f6f8b; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16151a; --panel:#211f27; --ink:#ece8f4; --muted:#a39db0; --line:#37333f; --accent:#a98bf0; --doom:#ef6b61; --clue:#5fb8d6; --ok:#6fcf73; } }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:1; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  .pill { padding:2px 10px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  /* the phase pill takes the banner's tint, so the header keeps saying what the banner said */
  .pill.phase { border-color:color-mix(in srgb, var(--phase-color) 60%, transparent);
    background:color-mix(in srgb, var(--phase-color) 42%, rgba(8, 11, 13, .88));
    color:rgba(242, 232, 207, .94);
    box-shadow:0 0 12px color-mix(in srgb, var(--phase-color) 30%, transparent);
    transition:background .3s ease, border-color .3s ease, box-shadow .3s ease; }
  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .doom { color:var(--doom); font-weight:600; } .clue { color:var(--clue); font-weight:600; }
  main { display:grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap:12px; padding:12px 16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; min-width:0; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  .q { border-left:3px solid var(--accent); padding-left:10px; margin-bottom:12px; }
  .q .prompt { font-weight:600; margin-bottom:6px; }
  .q button:has(.label-cards) { display:inline-flex; flex-direction:column; align-items:center; gap:6px; padding:8px; vertical-align:top; }
  .label-cards { display:flex; gap:6px; }
  .label-card { position:relative; display:block; }
  .label-card img { display:block; width:120px; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .label-sheet img { width:260px; }
  .label-zoom { position:absolute; right:4px; top:4px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:rgba(0,0,0,.65); color:#fff; font-size:15px; cursor:zoom-in; }
  .label-zoom:hover { background:rgba(0,0,0,.85); }
  .test-box { margin:10px 0 0; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:color-mix(in srgb, var(--accent) 6%, transparent); display:grid; gap:10px; }
  .test-head { display:flex; align-items:center; gap:10px; }
  .test-head > div:nth-child(2) { flex:1; }
  .test-kind { font-size:12px; color:var(--muted); }
  .test-score { text-align:right; font-size:12px; color:var(--muted); white-space:nowrap; }
  .test-score b { display:block; font-size:22px; line-height:1; color:var(--ink); }
  .test-score.pass b { color:var(--ok); }
  .test-steps { display:flex; gap:4px; margin:0; padding:0; list-style:none; counter-reset:step; font-size:12px; }
  .test-steps li { flex:1; counter-increment:step; padding:4px 8px; border-radius:6px; background:color-mix(in srgb, var(--line) 50%, transparent); color:var(--muted); white-space:nowrap; }
  .test-steps li::before { content:counter(step) ". "; }
  .test-steps li.done { color:inherit; opacity:.7; }
  .test-steps li.now { background:var(--accent); color:#fff; font-weight:600; }
  .test-dice { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .test-dice .die { width:34px; height:34px; line-height:34px; margin:0; font-size:17px; border-radius:7px; }
  .test-dice .die.miss { opacity:.65; }
  .test-dice .die.removed { opacity:.3; text-decoration:line-through; }
  .test-facts { display:flex; flex-wrap:wrap; gap:6px; }
  .test-fact { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  button { font:inherit; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:4px 10px; border-radius:6px; margin:0 6px 6px 0; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .nb { border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:8px; }
  .nb .title { font-weight:600; display:flex; gap:8px; flex-wrap:wrap; }
  .space { display:flex; gap:8px; flex-wrap:wrap; padding:2px 0 2px 10px; }
  .space .name { min-width:90px; color:var(--muted); }
  .tag { font-size:12px; padding:0 6px; border-radius:4px; background:var(--bg); border:1px solid var(--line); }
  .tag.inv { border-color:var(--ok); } .tag.mon { border-color:var(--doom); }
  table { border-collapse:collapse; width:100%; } td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--line); font-size:13px; }
  .log { max-height:320px; overflow:auto; font-family: ui-monospace, monospace; font-size:12px; white-space:pre-wrap; }
  .die { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center; border:1px solid var(--line); border-radius:4px; margin-right:4px; font-weight:700; }
  .die.hit { background:var(--ok); color:#fff; border-color:var(--ok); }
  .err { color:var(--doom); }
  .map-section { margin:12px 16px 0; padding:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .map-wrap { position:relative; overflow:hidden; touch-action:pan-y; }
  .map-wrap.panning { cursor:grabbing; }
  .map-wrap.zoomed { cursor:grab; touch-action:none; }
  .map-controls { position:absolute; top:8px; right:8px; z-index:3; display:flex; gap:4px; }
  .map-controls button { margin:0; width:34px; height:34px; padding:0; font-size:18px; line-height:1; background:color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter:blur(4px); }
  .map-hint { position:absolute; left:10px; bottom:8px; z-index:3; font-size:11px; color:var(--muted); background:color-mix(in srgb, var(--panel) 80%, transparent); padding:2px 8px; border-radius:999px; pointer-events:none; opacity:0; transition:opacity .2s; }
  .map-wrap:hover .map-hint { opacity:1; }
  body.map-full { overflow:hidden; }
  body.map-full .map-wrap { position:fixed; inset:0; z-index:30; background:var(--bg); touch-action:none; }
  body.map-full #map, body.map-full .map-wrap .board-fit { height:100% !important; }
  body.map-full #mapFullToggle { background:var(--accent); color:#fff; border-color:var(--accent); }
  .map-controls button svg { width:18px; height:18px; vertical-align:middle; }
  .map-wrap.hide-tokens #tokensToggle { background:var(--accent); color:#fff; border-color:var(--accent); }
  /* the anchors stay, so a space you can choose still glows and still takes the click */
  .map-wrap.hide-tokens .anchor > :not(.pick-ring) { visibility:hidden; }
  .map-row { display:flex; gap:14px; align-items:flex-start; }
  .map-row .map-wrap { flex:1; min-width:0; }
  .scenario-side { flex:0 0 clamp(200px, 20vw, 320px); cursor:zoom-in; position:relative; align-self:flex-start; }
  .sheet-tokens { position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); display:flex; gap:10px; padding:4px 10px; border-radius:999px; background:color-mix(in srgb, var(--panel) 88%, transparent); box-shadow:0 2px 8px rgba(0,0,0,.35); z-index:2; }
  .sheet-tokens .tok b { min-width:20px; height:20px; line-height:20px; font-size:13px; }
  .sheet-tokens .bump { animation:sheetBump .9s ease-out; }
  @keyframes sheetBump { 0% { transform:scale(1); } 30% { transform:scale(1.45); filter:drop-shadow(0 0 8px var(--doom)); } 100% { transform:scale(1); } }
  @media (prefers-reduced-motion: reduce) { .sheet-tokens .bump { animation:none; } }
  @media (max-width: 900px) { .map-row { flex-direction:column; } .scenario-side { width:min(320px, 100%); flex-basis:auto; } }
  .board-fit { position:relative; overflow:hidden; }
  .board { position:absolute; top:0; left:0; margin:0; transform-origin:top left; will-change:transform; }
  .board > img { position:absolute; pointer-events:none; user-select:none; }
  .anchor { position:absolute; transform:translate(-50%,-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:3px; max-width:120px; min-width:26px; min-height:26px; border-radius:14px; padding:2px; }
  .anchor.selectable { cursor:pointer; }
  /* the pick ring is a fixed small circle on the space's point, above its tokens and monster
     cards, so a click inside it picks the space instead of enlarging a card */
  .pick-ring { position:absolute; left:50%; top:50%; width:38px; height:38px; transform:translate(-50%,-50%); border-radius:50%; z-index:3; cursor:pointer;
    box-shadow:0 0 0 3px #ffd54a, 0 0 12px 4px rgba(255,213,74,.7); background:rgba(255,213,74,.22); }
  .pick-ring:hover { background:rgba(255,213,74,.45); }
  .chip { font-size:11px; font-weight:700; line-height:1; padding:4px 6px; border-radius:10px; color:#fff; white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.6); }
  .chip.doom { background:#b3261e; } .chip.clue { background:#1f6f8b; } .chip.inv { background:#2e7d32; }
  .chip.mon { background:#4a148c; } .chip.marker { background:#555; } .chip.anom { background:#e65100; }
  .chip.marker.blue { background:#1565c0; } .chip.marker.red { background:#c62828; } .chip.marker.white { background:#eee; color:#222; }
  .other-space { display:inline-flex; gap:6px; align-items:center; margin:6px 8px 0 0; padding:4px 8px; border:1px solid var(--line); border-radius:6px; }
  .other-space.selectable { cursor:pointer; box-shadow:0 0 0 3px #ffd54a; }
  .tok { position:relative; display:inline-block; vertical-align:middle; flex:none; }
  .tok img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .tok b, .deck-count, .log-unread { user-select:none; -webkit-user-select:none; }
  .tok b { position:absolute; right:-4px; bottom:-4px; min-width:16px; height:16px; padding:0 3px; border-radius:8px; background:#111; color:#fff; font-size:11px; line-height:16px; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,.5); }
  .toks { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .cup { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:4px 0; }
  #debugToggle.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .dbg-tokwrap { display:inline-flex; flex-direction:column; align-items:center; gap:2px; }
  .dbg-num { width:46px; background:#1b1a24; color:inherit; border:1px solid var(--line);
    border-radius:5px; padding:1px 3px; font:inherit; font-size:11px; text-align:center; }
  .dbg-inline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:6px;
    padding-top:6px; border-top:1px dashed var(--line); }
  .dbg-inline label { display:inline-flex; gap:4px; align-items:center; color:var(--muted); font-size:11px; }
  .dbg-gain input { width:130px; background:#1b1a24; color:inherit; border:1px solid var(--line);
    border-radius:5px; padding:2px 5px; font:inherit; font-size:11px; }
  .dbg-gain button, .dbg-deal { font-size:11px; padding:1px 6px; }
  .dbg-deal { position:absolute; left:-6px; bottom:-6px; z-index:2; border-radius:11px;
    min-width:22px; height:22px; line-height:1; }
  .sheet-tokens .dbg-num { width:40px; }
  .dbg-view { position:absolute; right:-6px; top:-6px; z-index:2; border-radius:11px;
    min-width:22px; height:22px; line-height:1; font-size:11px; padding:1px 5px; }
  .browse { max-width:min(1100px, 92vw); max-height:86vh; overflow:auto; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:14px 16px; cursor:default; }
  .browse > h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase;
    letter-spacing:.04em; color:var(--muted); }
  .browse-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; }
  .browse-card { position:relative; margin:0; cursor:pointer; border-radius:8px; }
  .browse-card img { display:block; width:100%; border-radius:6px; }
  .browse-card:hover { outline:2px solid var(--accent); outline-offset:2px; }
  .browse-pos { position:absolute; left:4px; top:4px; min-width:18px; height:18px; padding:0 4px;
    border-radius:9px; background:rgba(0,0,0,.7); color:#fff; font-size:10px; line-height:18px; text-align:center; }
  .dbg-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .dbg-row > label { min-width:84px; color:var(--muted); font-size:12px; }
  .dbg-row input[type=number] { width:64px; }
  .dbg-row input, .dbg-row select { background:#1b1a24; color:inherit; border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:inherit; font-size:12px; }
  .dbg-group { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  .dbg-group > h3 { margin:0 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #debug button { font-size:12px; padding:4px 8px; }
  .cup > span:first-child { min-width:110px; color:var(--muted); }
  .inv-tok { width:34px; height:34px; border-radius:50%; box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.8); }
  .player-area { display:flex; flex-wrap:wrap; gap:12px; padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  .player-area.turn { box-shadow:0 0 0 2px var(--accent); }
  .player-area.out .sheet, .player-area.out .standee { filter:grayscale(1) brightness(.7); }
  .sheet { position:relative; width:min(420px, 100%); flex:none; align-self:flex-start; }
  .sheet > img { width:100%; display:block; border-radius:6px; }
  .sheet .sheet-text { display:none; }
  .sheet.no-art .sheet-text { display:block; padding:10px; border:1px dashed var(--line); border-radius:6px; }
  .sheet-text i { display:block; color:var(--muted); } .sheet-text p { margin:6px 0 0; }
  .sheet-focus { position:absolute; left:37%; transform:translate(-50%,-50%); }
  .pa-side { flex:1; min-width:220px; display:flex; flex-direction:column; gap:10px; }
  .pa-head { display:flex; gap:10px; align-items:center; }
  .standee { height:64px; transition:transform .2s; }
  .standee.delayed { transform:rotate(90deg); }
  .pa-name { font-weight:700; font-size:15px; }
  .pa-turn { font-size:11px; font-weight:600; color:var(--accent); }
  .pa-where { color:var(--muted); }
  .pa-actions { display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12px; color:var(--muted); }
  .pa-actions .pips { display:flex; gap:3px; }
  .pa-actions .pip { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--accent); }
  .pa-actions .pip.used { background:var(--accent); }
  .pa-status { display:inline-block; margin-top:2px; font-size:12px; color:var(--doom); font-weight:700; }
  .pa-cards { display:flex; flex-wrap:wrap; gap:8px; }
  .asset { position:relative; width:110px; }
  .asset img { width:100%; display:block; border-radius:6px; box-shadow:0 2px 6px rgba(0,0,0,.5); }
  .asset .asset-name { display:none; }
  .asset.in-test img { outline:3px solid var(--accent); outline-offset:2px; box-shadow:0 0 16px color-mix(in srgb, var(--accent) 55%, transparent); }
  .asset .in-test-tag { position:absolute; top:-9px; left:50%; transform:translateX(-50%); padding:1px 8px; border-radius:999px; background:var(--accent); color:#fff; font-size:11px; font-weight:600; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .q button.chosen { outline:2px solid var(--accent); outline-offset:2px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.55); }
  .asset.no-art { height:170px; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); }
  .asset.no-art .asset-name { display:block; font-weight:600; }
  .asset-badges { position:absolute; left:4px; bottom:4px; display:flex; gap:4px; }
  .tabs-row { display:flex; align-items:flex-end; }
  ul.tabs__header { flex:1; display:flex; list-style:none; padding:30px 0 0 5px; margin:0; user-select:none; font-size:min(16px, 2vw); }
  ul.tabs__header > li { margin:0 3px 0 0; cursor:pointer; color:white; opacity:.5; border-radius:2px 2px 0 0; position:relative; display:inline-flex; align-items:center; }
  ul.tabs__header > li > span { display:block; width:fit-content; padding:5px 10px; }
  ul.tabs__header > li.tab--selected { font-weight:bold; opacity:1; }
  ul.tabs__header > li.tab--has-actions { opacity:.85; }
  .tab-pulse { position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, #ff00ff 88%, transparent), 0 0 9px color-mix(in srgb, #ff00ff 36%, transparent); animation:tab-action-pulse 1.8s ease-in-out infinite alternate; }
  .tab--Guardian { background-color:#0c5693; } .tab--Seeker { background-color:#aa6005; } .tab--Rogue { background-color:#186a1d; }
  .tab--Mystic { background-color:#5e4389; } .tab--Survivor { background-color:#a3262d; } .tab--Neutral { background-color:#333; }
  .tab--active-player::before { content:"▶"; font-size:.7em; margin-left:8px; align-self:center; }
  .tab--lead-player::after { position:absolute; content:""; inset:0; top:-5px; margin-inline:auto; transform:translateY(-100%); width:25px; height:25px; background-image:url('/img/ah3e/tokens/first-player-active.webp'); background-size:contain; background-repeat:no-repeat; }
  .waiting-indicator { display:inline-flex; align-items:center; justify-content:center; align-self:stretch; padding:4px 8px; border-left:1px solid rgba(0,0,0,.5); background-color:rgba(0,0,0,.5); border-radius:0 2px 0 0; color:#ff00ff; }
  .waiting-spinner { display:inline-block; animation:waiting-on-spin 5s linear infinite; }
  @keyframes waiting-on-spin { to { transform:rotate(360deg); } }
  @keyframes tab-action-pulse { from { opacity:.45; } to { opacity:1; } }
  ul.tabs__header > li.inactive { filter:grayscale(100%); }
  .tab .player-area { margin-bottom:0; border-top-left-radius:0; }
  .decks { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; padding:14px 8px 4px; border-top:1px solid var(--line); margin-top:8px; }
  .deck { display:flex; flex-direction:column; align-items:center; gap:6px; width:96px; }
  .deck-stack { position:relative; width:84px; height:132px; }
  .deck-stack > img { width:84px; height:132px; object-fit:cover; border-radius:6px; }
  .deck-stack > img + .deck-empty { display:none; }
  .deck-stack.no-art > .deck-empty { display:flex; }
  .deck-empty { width:84px; height:132px; border:2px dashed var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; }
  .deck-count { position:absolute; right:-6px; bottom:-6px; min-width:24px; height:24px; padding:0 6px; border-radius:12px; background:#111; color:#fff; font-size:13px; line-height:24px; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,.5); }
  .deck-clue { position:absolute; left:-8px; top:-8px; }
  .deck-name { font-size:12px; color:var(--muted); text-align:center; }
  .sheet-flip { perspective:1400px; }
  .sheet-flip .flip { position:relative; width:100%; aspect-ratio:1503/1200; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.4,.1,.2,1); }
  .sheet-flip .flip.flipped { transform:rotateY(180deg); }
  .sheet-flip .face { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; backface-visibility:hidden; border-radius:8px; }
  .sheet-flip .front { transform:rotateY(180deg); }
  @media (prefers-reduced-motion: reduce) {
    .sheet-flip .flip { transition:none; }
    ::view-transition-group(*) { animation:none; }
  }
  ::view-transition-group(*) { animation-duration:.4s; }
  /* a banner up when an update starts is captured too, and must stay above the tweening tokens */
  .phase-banner { view-transition-name:phase-banner; }
  ::view-transition-group(phase-banner) { z-index:1000; animation:none; }
  .deck-group.lead { display:flex; flex-wrap:wrap; gap:18px; padding-right:18px; margin-right:4px; border-right:1px solid var(--line); }
  .anchor.unstable { box-shadow:0 0 0 2px var(--doom), 0 0 14px 4px rgba(179,38,30,.55); background:rgba(179,38,30,.16); }
  .space-outlines { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .space-highlights { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .space-highlights > g { display:none; }
  /* the generic .hl pulse animates CSS filter, which would replace the SVG filter that draws the outline */
  .space-highlights > g.hl { display:inline; animation:outlinePulse .9s ease-in-out infinite alternate; }
  @keyframes outlinePulse { from { opacity:1; } to { opacity:.6; } }
  @media (prefers-reduced-motion: reduce) { .space-highlights > g.hl { animation:none; } }
  /* the outline marks the whole space, so the ring around its tokens would only repeat it */
  .anchor.shaped.hl { box-shadow:none; background:none; animation:none; }
  .space-outlines.held { opacity:0; }
  .anchor.unstable.held { box-shadow:none; background:none; }
  .space-outlines.reveal { animation:unstableIn .7s ease-out; }

    <section style="margin-top:12px"><h2>Player areas</h2><div id="investigators"></div></section>
  </div>
  <div>
    <section><h2>Codex</h2><div id="codexCards" class="codex"></div></section>
    <section style="margin-top:12px"><h2>Mythos</h2><div id="codex"></div></section>
    <section style="margin-top:12px"><details><summary>Raw game JSON</summary><pre id="raw"></pre></details></section>
  </div>
</main>
<script>
let state = null;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cardName = cid => esc(state.cardNames[cid] ?? `#${cid}`);
const invName = iid => state.investigatorNames[iid] ?? iid;
const show = v => typeof v === 'string' ? v : (v && v.tag ? v.tag + (v.contents !== undefined ? ' ' + JSON.stringify(v.contents) : '') : JSON.stringify(v));

// which map piece a choice refers to, so hovering it can point the piece out.
// Kept as "kind:id" rather than a selector so it survives HTML attribute quoting.
function labelTarget(l) {
  const c = l.contents;
  switch (l.tag) {
    case 'MonsterLabel': case 'CardLabel': return `mon:${c}`;
    case 'SpaceLabel': return `space:${cssName(c)}`;
    case 'InvestigatorLabel': return `inv:${cssName(c)}`;
    case 'SourceLabel': return sourceTarget(c);
    default: return null;
  }
}
// a reckoning names its source; point at whichever piece of the table holds it
function sourceTarget(s) {
  switch (s?.tag) {
    case 'SourceScenario': return 'sheet:scenario';
    case 'SourceCodex': return `codex:${s.contents}`;
    case 'SourceInvestigator': return `inv:${cssName(s.contents)}`;
    case 'SourceCard': case 'SourceHeadline': case 'SourceEncounter': case 'SourceMonster':
      return `card:${s.contents}`;
    default: return null;
  }
}
function sourceLabelHtml(s) {
  switch (s?.tag) {
    case 'SourceScenario': return 'Scenario sheet';
    case 'SourceCodex': return `Codex #${s.contents}`;
    case 'SourceInvestigator': return esc(invName(s.contents));
    case 'SourceCard': case 'SourceHeadline': case 'SourceEncounter': case 'SourceMonster':
      return esc(state.cardNames[s.contents] ?? `Card ${s.contents}`);
    case 'SourceMythos': return 'Mythos';
    case 'SourceRules': return 'Rules';
    default: return esc(show(s));
  }
}
let highlighted = null;
function applyHighlight() {
  document.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  if (!highlighted) return;
  const [kind, id] = highlighted.split(':');
  document.querySelectorAll(`[data-${kind}]`).forEach(e => {
    if (e.getAttribute(`data-${kind}`) === id) e.classList.add('hl');
  });
  // a space also lights up its outline, drawn above the unstable one and below the tokens
  if (kind === 'space') document.querySelectorAll(`[data-space-outline="${id}"]`).forEach(e => e.classList.add('hl'));
}
function highlight(target) { highlighted = target; applyHighlight(); }
document.addEventListener('mouseover', e => {
  const b = e.target.closest?.('[data-hl]');
  if (b) highlight(b.dataset.hl);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest?.('[data-hl]')) highlight(null);
});
document.addEventListener('focusin', e => {
  const b = e.target.closest?.('[data-hl]');
  highlight(b ? b.dataset.hl : null);
});
document.addEventListener('focusout', () => highlight(null));
function labelHtml(l) {
  const c = l.contents;
  switch (l.tag) {
    case 'TextLabel': case 'DoneLabel': return esc(c);
    case 'ActionLabel': return esc(show(c).replace(/Action$/, '').replace(/([a-z])([A-Z])/g, '$1 $2'));
    case 'SpaceLabel': return esc(spaceName(c));
    case 'MonsterLabel': return 'Monster: ' + cardName(c);
    case 'CardLabel': return cardName(c);
    case 'SkillLabel': return 'Skill: ' + esc(c);
    case 'DieLabel': return `Die ${c[0] + 1} (${c[1]})`;
    case 'CardsLabel': return cardsLabelHtml(c[0], c[1]);
    case 'InvestigatorLabel': return investigatorLabelHtml(c);
    case 'ScenarioLabel': return esc(state.scenarios.find(sc => sc.code === c)?.name ?? c);
    case 'AmountLabel': return esc(c);
    case 'TokenLabel': return mythosTok(c, 24) + ' ' + esc(c.replace(/Token$/, ''));
    case 'SourceLabel': return sourceLabelHtml(c);
    default: return esc(show(l));
  }
}
const spaceName = sid => state.game.board.spaces[sid]?.name ?? sid;
// the magnifier enlarges a card without answering; the rest of the button still picks the option
// choosing an investigator is easier with the sheet in front of you; the
// magnifier opens it flippable, since the back carries the starting possessions
function investigatorLabelHtml(iid) {
  const front = `/img/ah3e/investigators/${iid}/front.webp`;
  const back = `/img/ah3e/investigators/${iid}/back.webp`;
  const open = `zoomFlip('${front}', '${back}', 1126 / 900)`;
  return `<span class="label-cards"><span class="label-card label-sheet">`
    + `<img src="${front}" alt="${esc(invName(iid))}" onerror="hideBroken(this)">`
    + `<span class="label-zoom" role="button" tabindex="0" title="Enlarge, then click to flip"`
    + ` onclick="event.stopPropagation();${open}"`
    + ` onkeydown="if(event.key==='Enter'){event.stopPropagation();event.preventDefault();${open}}">\u2315</span>`
    + `</span></span><span class="label-cards-text">${esc(invName(iid))}</span>`;
}

function cardsLabelHtml(text, cids) {
  if (!cids.length) return esc(text);
  const cards = cids.map(cid => {
    const src = `/img/ah3e/cards/${cardCode(cid)}.webp`;
    return `<span class="label-card"><img src="${src}" alt="${esc(state.cardNames[cid] ?? '')}" onerror="hideBroken(this)">` +
      `<span class="label-zoom" role="button" tabindex="0" title="Enlarge" onclick="event.stopPropagation();zoom('${src}')" onkeydown="if(event.key==='Enter'){event.stopPropagation();event.preventDefault();zoom('${src}')}">\u2315</span></span>`;
  }).join('');
  return `<span class="label-cards">${cards}</span><span class="label-cards-text">${esc(text)}</span>`;
}

async function call(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body ?? {}) });
  const j = await r.json();
  if (j.error) { $('error').textContent = j.error; const se = $('setupError'); if (se) se.textContent = j.error; return; }
  $('error').textContent = '';
  const apply = () => { animateDraws = path !== '/api/undo'; state = j; render(); animateDraws = true; };
  // cards and tokens tween between their old and new positions. Await the
  // update callback (not the animation) so callers see the new state.
  if (document.startViewTransition && state) {
    viewTransition = document.startViewTransition(apply);
    try { await viewTransition.updateCallbackDone; } catch {}
  } else apply();
  if (path === '/api/answer') (j.game?.phasesEntered ?? []).forEach(announcePhase);
}
let viewTransition = null;
// undo puts cards back; flying them out of a deck would show the opposite of what happened
let animateDraws = true;
const refresh = () => call('/api/state');
const choose = (player, choice) => call('/api/answer', { player, choice });

// only answers announce: the engine lists the phases it began while resolving one,
// so a reload or an undo, which begin nothing, stay quiet
const PHASE_BANNERS = {
  ActionPhase: ['Action Phase', '#a87532'],
  MonsterPhase: ['Monster Phase', '#9f2929'],
  EncounterPhase: ['Encounter Phase', '#2f6b4f'],
  MythosPhase: ['Mythos Phase', '#7b4b91'],
};
const phaseQueue = [];
let phasePlaying = false;
function announcePhase(phase) {
  if (!PHASE_BANNERS[phase]) return;
  phaseQueue.push(phase);
  if (!phasePlaying) playPhaseBanners();
}
async function playPhaseBanners() {
  phasePlaying = true;
  while (phaseQueue.length) {
    const [name, color] = PHASE_BANNERS[phaseQueue.shift()];
    // tokens tweening in a view transition are drawn above the whole page, banner included
    await viewTransition?.finished.catch(() => {});
    const el = document.createElement('div');
    el.className = 'phase-banner';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    el.style.setProperty('--phase-color', color);
    el.innerHTML = `<span>${name}</span>`;
    document.body.appendChild(el);
    await new Promise(r => setTimeout(r, 1300));
    el.remove();
  }
  phasePlaying = false;
}
let undoing = false;
async function undo() {
  if (undoing || !state?.canUndo) return;
  undoing = true;
  try {
    await call('/api/undo', {});
    flash('Undone');
  } finally {
    undoing = false;
  }
}
function flash(text) {
  let el = document.getElementById('flash');
  if (!el) { el = document.createElement('div'); el.id = 'flash'; el.className = 'flash'; document.body.appendChild(el); }
  el.textContent = text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
document.addEventListener('keydown', e => {
  if (e.key !== 'u' && e.key !== 'U') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t instanceof HTMLElement && (t.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName))) return;
  if (!state?.game) return;
  e.preventDefault();
  undo();
});
const abandon = () => { if (confirm('Abandon this game?')) call('/api/reset', null); };
const EXPANSION_NAMES = { CoreSet:'Core Set', DeadOfNight:'Dead of Night', UnderDarkWaves:'Under Dark Waves', SecretsOfTheOrder:'Secrets of the Order', RecursiveEchoes:'Recursive Echoes'};
const expName = e => EXPANSION_NAMES[e] ?? e;

const TILE_W = 240;
const TILE_H = TILE_W * 2 / Math.sqrt(3);
const STREET_W = 0.534 * TILE_W, STREET_H = 0.537 * TILE_W;
const slugOf = nid => nid;
// ---- drag to move -------------------------------------------------------
// The engine only ever offers the next single step, so dragging works out the
// path itself and answers one step at a time. Paid steps are just another
// offered choice, so the money is spent by the engine as we walk.
let moveDrag = null;

function moveContext(g) {
  for (const [pid, q] of Object.entries(g.questions))
    for (const c of q.choices) {
      const mv = (c.messages ?? []).find(m => m.tag === 'MoveInvestigator');
      if (mv)
        return {
          pid: Number(pid),
          ms: mv.contents[0],
          iid: mv.contents[0].investigator,
          // the engine offers either free steps or paid ones, never both
          paid: (c.messages ?? []).some(m => m.tag === 'PayMoney'),
        };
    }
  return null;
}

function moveBudget(g, ctx) {
  const money = g.investigators[ctx.iid]?.money ?? 0;
  // a choice carries the move state as it would be AFTER that step, so undo it
  const free = ctx.paid ? ctx.ms.remaining : ctx.ms.remaining + 1;
  const usedPaid = ctx.paid ? ctx.ms.paidSteps - 1 : ctx.ms.paidSteps;
  const paid = Math.max(0, Math.min(ctx.ms.maxPaidSteps - usedPaid, money));
  return { free, paid, total: free + paid };
}

function movePaths(g, from, budget) {
  const borders = g.board.borders ?? {};
  const dist = { [from]: 0 };
  const prev = {};
  const queue = [from];
  while (queue.length) {
    const cur = queue.shift();
    if (dist[cur] >= budget) continue;
    for (const nxt of Object.keys(borders[cur] ?? {}))
      if (dist[nxt] === undefined) { dist[nxt] = dist[cur] + 1; prev[nxt] = cur; queue.push(nxt); }
  }
  delete dist[from];
  return { dist, prev };
}

function applyMoveDrag(g) {
  document.querySelectorAll('.droppable, .droppable-paid, .draggable-inv').forEach(e => {
    e.classList.remove('droppable', 'droppable-paid', 'draggable-inv');
    e.removeAttribute('draggable');
  });
  moveDrag = null;
  const ctx = moveContext(g);
  if (!ctx) return;
  const from = g.investigators[ctx.iid]?.space;
  if (!from) return;
  const { free, total } = moveBudget(g, ctx);
  const { dist } = movePaths(g, from, total);
  moveDrag = { ...ctx, from };
  const tok = document.querySelector(`[data-inv="${cssName(ctx.iid)}"]`);
  if (tok) { tok.setAttribute('draggable', 'true'); tok.classList.add('draggable-inv'); }
  for (const [sid, d] of Object.entries(dist)) {
    const el = document.querySelector(`[data-space="${cssName(sid)}"]`);
    if (!el) continue;
    el.dataset.sid = sid;
    el.classList.add(d <= free ? 'droppable' : 'droppable-paid');
  }
}

async function walkTo(target) {
  for (let guard = 0; guard < 16; guard++) {
    const g = state?.game;
    if (!g) return;
    const ctx = moveContext(g);
    if (!ctx) return;
    const from = g.investigators[ctx.iid]?.space;
    if (!from || from === target) return;
    const { total } = moveBudget(g, ctx);
    const { dist, prev } = movePaths(g, from, total);
    if (dist[target] === undefined) return;
    let step = target;
    while (prev[step] !== undefined && prev[step] !== from) step = prev[step];
    const idx = g.questions[ctx.pid].choices.findIndex(
      c => c.label.tag === 'SpaceLabel' && c.label.contents === step
    );
    if (idx < 0) return;
    await call('/api/answer', { player: ctx.pid, choice: idx });
    if (state?.game?.investigators[ctx.iid]?.space === from) return;
  }
}

const dropTarget = e => e.target.closest?.('.droppable, .droppable-paid');
document.addEventListener('dragstart', e => {
  if (!e.target.closest?.('.draggable-inv') || !moveDrag) return;
  e.dataTransfer?.setData('text/plain', moveDrag.iid);
  if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
  document.body.classList.add('moving');
});
document.addEventListener('dragend', () => {
  document.body.classList.remove('moving');
  document.querySelectorAll('.drop-hover').forEach(e => e.classList.remove('drop-hover'));
});
document.addEventListener('dragover', e => {
  const a = dropTarget(e);
  if (!a || !moveDrag) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  a.classList.add('drop-hover');
});
document.addEventListener('dragleave', e => dropTarget(e)?.classList.remove('drop-hover'));
document.addEventListener('drop', e => {
  const a = dropTarget(e);
  if (!a || !moveDrag) return;
  e.preventDefault();
  a.classList.remove('drop-hover');
  document.body.classList.remove('moving');
  if (a.dataset.sid) walkTo(a.dataset.sid);
});

function spaceChoices(g) {
  const m = {};
  for (const [pid, q] of Object.entries(g.questions))
    q.choices.forEach((c, i) => { if (c.label.tag === 'SpaceLabel') (m[c.label.contents] ??= []).push([pid, i]); });
  return m;
}
// a pill is plain text, or {text, cls, color} when it wants the phase tint
const pills = items => items.map(t =>
  typeof t === 'string'
    ? `<span class="pill">${esc(t)}</span>`
    : `<span class="pill ${t.cls ?? ''}"${t.color ? ` style="--phase-color:${t.color}"` : ''}>${esc(t.text)}</span>`
).join('');
const TOKEN = n => `/img/ah3e/tokens/${n}.webp`;
const initials = iid => invName(iid).replace(/"/g, '').split(' ').map(w => w[0]).join('');
function invFallback(img) { const s = document.createElement('span'); s.className = 'chip inv'; s.title = img.title; s.textContent = img.dataset.initials; img.replaceWith(s); }
function hideBroken(img) { img.parentElement.classList.add('no-art'); img.remove(); }
const slug = t => String(t).toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const cardCode = cid => state.cardCodes?.[cid] ?? slug(state.cardNames[cid] ?? cid);
// skill rows on the investigator sheet front, as fractions of the image
const SKILL_ROWS = { Lore: 0.6, Influence: 0.685, Observation: 0.77, Strength: 0.853, Will: 0.935 };
const tok = (name, count, title, size = 28, always = false) =>
  `<span class="tok" title="${esc(title ?? name)}" style="width:${size}px;height:${size}px"><img src="${TOKEN(name)}" alt="${esc(title ?? name)}">${count !== undefined && count !== null && (always || count !== 1) ? `<b>${count}</b>` : ''}</span>`;
const MYTHOS = { SpreadDoomToken:'mythos-spread-doom', SpawnMonsterToken:'mythos-spawn-monster', ReadHeadlineToken:'mythos-read-headline', SpawnClueToken:'mythos-spawn-clue', GateBurstToken:'mythos-gate-burst', ReckoningToken:'mythos-reckoning', BlankToken:'mythos-blank', SpreadTerrorToken:'mythos-spread-terror' };
const FOCUS = { Lore:'focus-lore', Influence:'focus-influence', Observation:'focus-observation', Strength:'focus-strength', Will:'focus-willpower' };
const mythosTok = (t, size) => tok(MYTHOS[t] ?? 'mythos-blank', null, t.replace(/Token$/, '').replace(/([a-z])([A-Z])/g, '$1 $2'), size);
const markerTok = m => m.faceUp ? tok(`${m.color}-marker`, null, `${m.color} marker`) : tok('marker-back', null, 'facedown marker');
const counted = (name, n, title, size) => n ? tok(name, n, title, size) : '';
const cssName = s => String(s).replace(/[^a-zA-Z0-9_-]/g, '-');
const vt = (name, html) => `<span style="view-transition-name:${cssName(name)};display:inline-flex">${html}</span>`;
const SHROUDED = new Set(['haunting-dead', 'screaming-haunt', 'weeping-haunt', 'cacophonous-haunt', 'raging-poltergeist', 'commanding-specter', 'confounding-specter', 'crashing-specter', 'stalking-wraith', 'sanguinous-wraith', 'vomitous-wraith']);
// 428.2: an engaged monster sits in the play area of the investigator it is engaged with;
// a massive one stays in its space (451.3)
const inPlayerArea = m => m.state?.tag === 'Engaged' && !(state.massive ?? []).includes(m.card);
function monsterCard(m) {
  const name = state.cardNames[m.card] ?? 'Monster';
  const ready = m.state?.tag === 'Ready';
  const src = `/img/ah3e/cards/${cardCode(m.card)}${ready ? '' : 'b'}.webp`;
  const engaged = m.state?.tag === 'Engaged';
  const dmg = m.damage ?? 0;
  const title = `${name}${ready ? '' : engaged ? ' (engaged)' : ' (exhausted)'}${dmg ? ` \u00b7 ${dmg} damage` : ''}`;
  // a ready shrouded monster keeps its engaged/exhausted side hidden
  const other = SHROUDED.has(cardCode(m.card)) && ready ? null : `/img/ah3e/cards/${cardCode(m.card)}${ready ? 'b' : ''}.webp`;
  const zoomArgs = other ? `'${src}','${other}'` : `'${src}'`;
  return `<span data-mon="${m.card}" data-card="${m.card}" style="view-transition-name:mon-${m.card}" class="mon-card${engaged ? ' engaged' : ''}" title="${esc(title)}" onclick="event.stopPropagation();zoom(${zoomArgs})">
    <img src="${src}" alt="" onerror="hideBroken(this)"><span class="chip mon">${esc(name.slice(0, 10))}</span>${dmg ? `<span class="mon-dmg">${tok('damage', dmg, `${dmg} damage`, 22, true)}</span>` : ''}</span>`;
}
function chipsFor(g, sid, invs, monsters) {
  const s = g.board.spaces[sid];
  const out = [];
  if (s.doom) out.push(vt(`doom-${sid}`, tok('doom', s.doom, `${s.doom} doom`)));
  if (s.clues) out.push(vt(`clue-${sid}`, tok('clue', s.clues, `${s.clues} clues`)));
  s.markers.forEach(m => out.push(markerTok(m)));
  invs.filter(i => i.space === sid).forEach(i => out.push(`<img data-inv="${cssName(i.id)}" style="view-transition-name:inv-${cssName(i.id)}" class="inv-tok" src="/img/ah3e/investigators/${i.id}/token.webp" title="${esc(invName(i.id))}" data-initials="${esc(initials(i.id))}" onerror="invFallback(this)">`));
  monsters.filter(m => m.space === sid && !inPlayerArea(m)).forEach(m => out.push(monsterCard(m)));
  return out.join('');
}
const HUB_R = 0.135;
// the piece's own alpha, clipped to the space, eroded and subtracted to leave a ring on its real edge
const outlineFilter = (id, stroke, fill) => `<filter id="${id}" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
  <feComponentTransfer in="SourceAlpha" result="solid"><feFuncA type="linear" slope="3"/></feComponentTransfer>
  <feMorphology in="solid" operator="erode" radius="3" result="inner"/>
  <feComposite in="solid" in2="inner" operator="out" result="ring"/>
  <feFlood style="flood-color:${stroke}" result="edge"/>
  <feComposite in="edge" in2="ring" operator="in" result="stroke"/>
  <feFlood flood-color="${fill}" flood-opacity=".18"/>
  <feComposite in2="inner" operator="in" result="fill"/>
  <feGaussianBlur in="stroke" stdDeviation="4" result="glow"/>
  <feMerge><feMergeNode in="glow"/><feMergeNode in="fill"/><feMergeNode in="stroke"/></feMerge>
</filter>`;
const OUTLINE_FILTER = outlineFilter('spaceOutline', 'var(--doom)', 'rgb(179,38,30)');
const HIGHLIGHT_FILTER = outlineFilter('spaceHighlight', '#ffd54f', 'rgb(255,213,79)');
// Setup marks no unstable space until step 11 turns the first event card into the
// discard (111.3); the starting-space fallback of 493.3 is left to the engine.
function unstableShown(g) {
  if (g.phase === 'SetupPhase' && !g.decks.eventDiscard.length) return [];
  return state.unstable ?? [];
}
// while an event card is flying to the discard, the unstable space it names stays hidden until it lands
let holdUnstable = false;
function holdUnstableUntil(done) {
  holdUnstable = true;
  document.querySelectorAll('.space-outlines, .anchor.unstable').forEach(el => el.classList.add('held'));
  Promise.resolve(done).finally(() => {
    holdUnstable = false;
    document.querySelectorAll('.space-outlines.held, .anchor.unstable.held').forEach(el => {
      el.classList.remove('held');
      el.classList.add('reveal');
    });
  });
}
// the outline of one space: a location's wedge of its tile, or a street's body between the tiles
function spaceShape(g, L, px, py, sid, filter, idPrefix, title = '') {
  const at = (cx, cy, r, deg) => [px(cx + r * Math.cos(deg * Math.PI / 180)), py(cy + r * Math.sin(deg * Math.PI / 180))];
  const pt = ([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`;
  const id = `${idPrefix}-${cssName(sid)}`, key = cssName(sid);
  const a = L.anchors.find(a => a.space === sid);
  const t = a && L.tiles.find(t => t.neighborhood === g.board.spaces[sid]?.neighborhood);
  if (a && t) {
    const c = Math.atan2(a.y - t.y, a.x - t.x) * 180 / Math.PI, hub = HUB_R * TILE_W;
    // the wedge between the two dividing lines, running well past the tile so its alpha sets the outer edge
    const far = [-60, -30, 0, 30, 60].map(o => pt(at(t.x, t.y, 0.8, c + o)));
    return {
      clip: `<clipPath id="${id}"><path d="M${pt(at(t.x, t.y, HUB_R, c - 60))} L${far.join(' L')} L${pt(at(t.x, t.y, HUB_R, c + 60))} A${hub} ${hub} 0 0 0 ${pt(at(t.x, t.y, HUB_R, c - 60))} Z"/></clipPath>`,
      shape: `<g data-space-outline="${key}" filter="url(#${filter})">${title}<image href="/img/ah3e/tiles/${slugOf(t.neighborhood)}.webp" x="${px(t.x) - TILE_W / 2}" y="${py(t.y) - TILE_H / 2}" width="${TILE_W}" height="${TILE_H}" preserveAspectRatio="none" clip-path="url(#${id})"/></g>`,
    };
  }
  const st = L.streets.find(st => st.space === sid);
  if (!st) return null;
  const type = (g.board.spaces[sid]?.kind?.contents ?? 'Residential').toLowerCase();
  let angle = st.angle % 360; if (angle > 90 && angle <= 270) angle -= 180;
  const cx = px(st.x), cy = py(st.y);
  // the whole tile, letting its own alpha set the border as a neighborhood tile's does
  return {
    clip: '',
    shape: `<g data-space-outline="${key}" filter="url(#${filter})">${title}<image href="/img/ah3e/streets/${type}.webp" x="${cx - STREET_W / 2}" y="${cy - STREET_H / 2}" width="${STREET_W}" height="${STREET_H}" preserveAspectRatio="none" transform="rotate(${angle} ${cx} ${cy})"/></g>`,
  };
}
function spaceOutlines(g, L, px, py) {
  const ids = new Set(), clips = [], shapes = [];
  for (const sid of new Set(unstableShown(g))) {
    const title = `<title>${esc(g.board.spaces[sid]?.name ?? sid)} \u2014 unstable space</title>`;
    const s = spaceShape(g, L, px, py, sid, 'spaceOutline', 'clip', title);
    if (!s) continue;
    clips.push(s.clip);
    // the unstable outline is not a hover target; only the highlight layer answers to hovering
    shapes.push(s.shape.replace(/^<g data-space-outline="[^"]*"/, '<g'));
    ids.add(sid);

  const svg = shapes.length ? `<svg class="space-outlines${holdUnstable ? ' held' : ''}" width="1" height="1"><defs>${OUTLINE_FILTER}${clips.join('')}</defs>${shapes.join('')}</svg>` : '';

    const s = spaceShape(g, L, px, py, sid, 'spaceHighlight', 'hlclip');

}

function renderMap(g, invs, monsters) {
  const L = g.board.layout;
  if (!L || !L.tiles.length) { $('map').innerHTML = ''; return; }
  const pts = [...L.tiles.map(t => [t.x, t.y, 0.5, 0.58]), ...L.streets.map(s => [s.x, s.y, 0.3, 0.3])];
  const minX = Math.min(...pts.map(p => p[0] - p[2])), maxX = Math.max(...pts.map(p => p[0] + p[2]));
  const minY = Math.min(...pts.map(p => p[1] - p[3])), maxY = Math.max(...pts.map(p => p[1] + p[3]));
  const px = x => (x - minX) * TILE_W, py = y => (y - minY) * TILE_W;
  const selectable = spaceChoices(g);
  const html = [];
  for (const st of L.streets) {
    const kind = g.board.spaces[st.space]?.kind;
    const type = (kind?.contents ?? 'Residential').toLowerCase();
    let angle = st.angle % 360; if (angle > 90 && angle <= 270) angle -= 180;
    html.push(`<img src="/img/ah3e/streets/${type}.webp" style="left:${px(st.x) - STREET_W / 2}px;top:${py(st.y) - STREET_H / 2}px;width:${STREET_W}px;height:${STREET_H}px;transform:rotate(${angle}deg)">`);
  }
  for (const t of L.tiles)
    html.push(`<img src="/img/ah3e/tiles/${slugOf(t.neighborhood)}.webp" style="left:${px(t.x) - TILE_W / 2}px;top:${py(t.y) - TILE_H / 2}px;width:${TILE_W}px;height:${TILE_H}px">`);
  const anchor = (sid, x, y) => {
    const sel = selectable[sid];
    const click = sel && sel.length === 1 ? `onclick="choose(${sel[0][0]},${sel[0][1]})"` : '';
    const unstable = unstableShown(g).includes(sid) && !outlined.ids.has(sid);
    const label = `${esc(g.board.spaces[sid]?.name ?? sid)}${unstable ? ' \u2014 unstable space' : ''}`;
    const ring = sel ? `<span class="pick-ring" ${click.replace('onclick="', 'onclick="event.stopPropagation();')} title="${esc(g.board.spaces[sid]?.name ?? sid)}"></span>` : '';
    return `<div data-space="${cssName(sid)}" class="anchor ${sel ? 'selectable' : ''}${unstable ? ' unstable' : ''}${unstable && holdUnstable ? ' held' : ''}${shaped.ids.has(sid) ? ' shaped' : ''}" ${click} title="${label}" style="left:${px(x)}px;top:${py(y)}px">${chipsFor(g, sid, invs, monsters)}${ring}</div>`;
  };
  const outlined = spaceOutlines(g, L, px, py);
  const shaped = spaceHighlights(g, L, px, py);
  html.push(outlined.svg, shaped.svg);
  for (const a of L.anchors) html.push(anchor(a.space, a.x, a.y));
  for (const st of L.streets) html.push(anchor(st.space, st.x, st.y));
  for (const t of L.tiles) {
    const n = g.board.neighborhoods[t.neighborhood];
    const chips = counted('clue', n.clues, `${n.clues} clues`, 30) + (n.anomaly ? tok('anomaly', null, 'anomaly', 34) : '') + counted('terror', n.terror, `${n.terror} terror`, 30);
    if (chips) html.push(`<div class="anchor" style="left:${px(t.x)}px;top:${py(t.y + 0.13)}px">${chips}</div>`);
  }
  mapTileCenters = L.tiles.map(t => [px(t.x), py(t.y)]);
  $('map').innerHTML = `<div class="board-fit"><div class="board" style="width:${(maxX - minX) * TILE_W}px;height:${(maxY - minY) * TILE_W}px">${html.join('')}</div></div>`;
  fitBoard();
  const placed = new Set([...L.anchors.map(a => a.space), ...L.streets.map(s => s.space)]);
  const others = Object.values(g.board.spaces).filter(s => !placed.has(s.id));
  $('otherSpaces').innerHTML = others.map(s => {
    const sel = selectable[s.id];
    const click = sel && sel.length === 1 ? `onclick="choose(${sel[0][0]},${sel[0][1]})"` : '';
    return `<span class="other-space ${sel ? 'selectable' : ''}" ${click}><b>${esc(s.name)}</b>${chipsFor(g, s.id, invs, monsters)}</span>`;
  }).join('');
}

// used and allowed actions this turn; the allowance comes from the server, which counts

const ROLE_CLASS = { Guardian: 'Guardian', Mystic: 'Mystic', Rogue: 'Rogue', Seeker: 'Seeker', Survivor: 'Survivor' };

function playerTabs(g, invs, playerArea) {
  const order = g.players.map(p => p.investigator).filter(Boolean);
  // defeated investigators go back in the box; only currently controlled ones get a tab
  const sorted = invs.filter(i => order.includes(i.id)).sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  if (!sorted.length) return '<em>None yet.</em>';
  if (!sorted.some(i => i.id === selectedTab)) {
    const mine = sorted.find(i => i.id === g.turn) ?? sorted[0];
    selectedTab = mine.id;
  }
  const playerOf = iid => g.players.find(p => p.investigator === iid)?.id;
  const hasChoices = iid => { const pid = playerOf(iid); return pid !== undefined && g.questions[pid] !== undefined; };
  const tabs = sorted.map(i => {
    const role = state.investigatorDefs?.[i.id]?.roles?.[0];
    const classes = [
      `tab--${ROLE_CLASS[role] ?? 'Neutral'}`,
      i.id === selectedTab ? 'tab--selected' : '',
      i.id === g.turn ? 'tab--active-player' : '',
      playerOf(i.id) === g.leader ? 'tab--lead-player' : '',
      i.status !== 'Playing' ? 'inactive' : '',
      i.id !== selectedTab && hasChoices(i.id) ? 'tab--has-actions' : '',
    ].join(' ');
    const pulse = i.id !== selectedTab && hasChoices(i.id) ? '<i class="tab-pulse" aria-hidden="true"></i>' : '';
    const waiting = sorted.length > 1 && hasChoices(i.id) ? '<span class="waiting-indicator" title="Waiting on this player"><span class="waiting-spinner">⟳</span></span>' : '';
    return `<li class="${classes}" onclick="selectTab('${i.id}')">${pulse}<span>${esc(invName(i.id))}</span>${waiting}</li>`;
  }).join('');
  const current = sorted.find(i => i.id === selectedTab);
  return `<div class="tabs-row"><ul class="tabs__header">${tabs}</ul></div><div class="tab">${playerArea(current)}</div>`;
}

            <input type="checkbox" name="exp" id="ngE${e}" value="${e}" ${e === 'CoreSet' ? 'checked disabled' : c.expansions.includes(e) ? 'checked' : ''}>
            <label for="ngE${e}"><img src="/img/ah3e/expansions/${expArt(e)}.webp" alt="" onerror="hideBroken(this)">
              <span class="ng-tile-text"><b>${esc(expName(e))}</b><small>${e === 'CoreSet' ? 'Always included · ' : ''}${counts[e] ? `${counts[e]} playable scenario${counts[e] === 1 ? '' : 's'}` : 'none playable yet'}</small></span></label>`).join('')}</div>
        </div>
        <div class="ng-card">
          <div class="ng-title">Game mode</div>
          <div class="ng-seg" style="--n:3">${GAME_MODES.map(([v, l]) => `
            <input type="radio" name="mode" id="ngM${v}" value="${v}" ${v === c.mode ? 'checked' : ''}><label for="ngM${v}">${l}</label>`).join('')}</div>
          <p class="ng-note" id="ngModeNote"></p>
        </div>
        <div class="ng-card">
          <div class="ng-title">Seed</div>
          <div class="ng-seed"><input id="seed" class="ng-text" type="number" value="${c.seed}">
            <button type="button" onclick="setupChoice.seed = Math.floor(Math.random() * 100000); $('seed').value = setupChoice.seed; readSetup()">Randomize</button></div>
          <p class="ng-note">The same seed and choices deal the same game.</p>
        </div>
        <div class="ng-actions"><button class="primary" type="submit" id="ngStart">Continue to scenario selection</button></div>
        <div id="setupError" class="err"></div>
      </div>
    </form>`;
  readSetup();
}
// keeps the choices across re-renders and updates the notes that depend on them
function readSetup() {
  const c = setupChoice;
  c.players = +(document.querySelector('input[name=players]:checked')?.value ?? c.players);
  // the core set is the base game; expansions only add to it
  c.expansions = ['CoreSet', ...[...document.querySelectorAll('input[name=exp]:checked')].map(i => i.value).filter(e => e !== 'CoreSet')];
  c.mode = document.querySelector('input[name=mode]:checked')?.value ?? c.mode;
  c.seed = +($('seed')?.value ?? c.seed);
  const mode = GAME_MODES.find(([v]) => v === c.mode);
  $('ngModeNote').textContent = mode?.[2] ?? '';
}
function startGame() {
  readSetup();
  const c = setupChoice;
  call('/api/new', { seed: c.seed, players: c.players, expansions: c.expansions, mode: c.mode });
}

// a scenario is picked by its sheet; the magnifier opens it flippable between story and setup sides
function scenarioTile(sc, pid, choice) {
  const story = `/img/ah3e/scenarios/${sc.code}.webp`, setup = `/img/ah3e/scenarios/${sc.code}b.webp`;
  const open = `zoomFlip('${story}', '${setup}')`;
  const waiting = choice === undefined;
  return `<div class="sc-tile${waiting ? ' waiting' : ''}">
    <button class="sc-pick" ${waiting ? 'disabled title="Waiting on card text"' : `onclick="choose(${pid},${choice})" title="Play ${esc(sc.name)}"`}>
      <img src="${story}" alt="" onerror="hideBroken(this)">
      <span class="sc-name">${esc(sc.name)}</span>
      <span class="sc-exp">${esc(expName(sc.expansion))}${waiting ? ' \u00b7 waiting on card text' : ''}</span>
    </button>
    <span class="label-zoom" role="button" tabindex="0" title="Enlarge, then click to flip" onclick="${open}"
      onkeydown="if(event.key==='Enter'){event.preventDefault();${open}}">\u2315</span>
  </div>`;
}
function renderScenarioChoice() {
  const g = state.game;
  const entries = Object.entries(g.questions);
  const expansions = g.expansions.map(expName).join(', ');
  if (!entries.length) { $('scenario').innerHTML = '<p class="waiting">Setting up…</p>'; return; }
  const [pid, q] = entries[0];
  const offered = Object.fromEntries(q.choices.map((c, i) => [c, i]).filter(([c]) => c.label.tag === 'ScenarioLabel').map(([c, i]) => [c.label.contents, i]));
  const listed = state.scenarios.filter(sc => g.expansions.includes(sc.expansion));
  const rest = q.choices.map((c, i) => [c, i]).filter(([c]) => c.label.tag !== 'ScenarioLabel');
  $('scenario').innerHTML = `
    <h2>Choose a scenario</h2>
    <p class="sub">Player ${pid} chooses for the group. ${g.players.length} player${g.players.length > 1 ? 's' : ''} · ${esc(expansions)} · ${esc(g.mode.replace('Mode',''))} mode</p>
    <div class="sc-grid">${listed.map(sc => scenarioTile(sc, pid, offered[sc.code])).join('')}</div>
    <div style="margin-top:16px">${rest.map(([c, i]) => `<button onclick="choose(${pid},${i})">${labelHtml(c.label)}</button>`).join('')}</div>`;
}

const TEST_STEPS = [['DeterminePool', 'Gather dice'], ['ManipulateDice', 'Reroll & adjust'], ['TestResolved', 'Resolve']];
const humanize = s => String(s).replace(/([a-z])([A-Z])/g, '$1 $2');
// ActionKind arrives tagged ({tag: 'EvadeAction'}), with the card it targets alongside
function actionTestName([kind, target] = []) {
  const tag = typeof kind === 'string' ? kind : kind?.tag ?? 'Action';
  const name = humanize(tag.replace(/Action$/, ''));
  const what = name ? `${name} action` : 'Action';
  return target == null ? what : `${what} \u00b7 ${state.cardNames[target] ?? `#${target}`}`;
}
// blessed and cursed are two faces of one card, so the name says nothing:
// the front is BLESSED, the back is CURSED (490.5)
function blessCurse(g, iid) {
  for (const cid of g.investigators[iid]?.assets ?? []) {
    if (cardCode(cid) !== 'blessed') continue;
    return g.assets[cid]?.flipped ? 'CURSED' : 'BLESSED';
  }
  return null;
}
function testBox(g, t) {
  const face = blessCurse(g, t.investigator);
  const cursed = face === 'CURSED', blessed = face === 'BLESSED';
  const need = cursed ? 6 : blessed ? 4 : 5;
  const live = t.dice.filter(d => !d.removed);
  const successes = live.filter(d => d.value >= need).length + (t.addedSuccesses ?? 0);
  const what = t.kind?.tag === 'EncounterTest' ? 'Encounter test'
    : t.kind?.tag === 'ActionTest' ? actionTestName(t.kind.contents)
    : t.kind?.tag === 'SpellTest' ? `Spell: ${state.cardNames[t.kind.contents] ?? 'spell'}`
    : humanize(t.kind?.tag ?? 'Test');
  const at = TEST_STEPS.findIndex(([k]) => k === t.step);
  const steps = TEST_STEPS.map(([, label], i) => `<li class="${i < at ? 'done' : i === at ? 'now' : ''}">${label}</li>`).join('');
  const sign = n => (n > 0 ? `+${n}` : n < 0 ? `\u2212${-n}` : '0');
  const facts = [
    t.modifier ? `Modifier ${sign(t.modifier)}` : null,
    t.bonusDice ? `${sign(t.bonusDice)} bonus ${t.bonusDice === 1 ? 'die' : 'dice'}` : null,
    `Success on ${need === 6 ? '6' : `${need}+`}${cursed ? ' (cursed)' : blessed ? ' (blessed)' : ''}`,
  ].filter(Boolean).map(f => `<span class="test-fact">${f}</span>`).join('');
  const dice = t.dice.map(d => `<span class="die ${d.removed ? 'removed' : d.value >= need ? 'hit' : 'miss'}" title="${d.removed ? 'removed' : d.value >= need ? 'success' : 'no success'}">${d.value}</span>`).join('');
  const added = t.addedSuccesses ? `<span class="test-fact">+${t.addedSuccesses} added</span>` : '';
  return `<div class="test-box">
    <div class="test-head">${tok(FOCUS[t.skill] ?? 'focus-lore', null, t.skill, 26)}<div><b>${esc(invName(t.investigator))}</b> tests <b>${esc(t.skill)}</b><div class="test-kind">${esc(what)}</div></div>
      <div class="test-score ${successes ? 'pass' : ''}"><b>${successes}</b> success${successes === 1 ? '' : 'es'}</div></div>
    <ol class="test-steps">${steps}</ol>
    <div class="test-dice">${dice || '<em class="waiting">No dice rolled yet</em>'}${added}</div>
    <div class="test-facts">${facts}</div></div>`;
}
function render() {
  const g = state.game;
  const drawBefore = drawRects();
  const view = !g ? 'setup' : g.scenario === null ? 'scenario' : 'game';
  $('setup').hidden = view !== 'setup';
  $('scenario').hidden = view !== 'scenario';
  $('game').hidden = view !== 'game';
  $('mapSection').hidden = view !== 'game';
  $('abandon').hidden = !g;
  $('logToggle').hidden = !g;
  $('undo').hidden = !g;
  $('undo').disabled = !state.canUndo;
  $('debugToggle').hidden = !g?.debug;
  $('debugToggle').classList.toggle('on', debugMode);
  document.body.classList.toggle('log-open', !!g && logOpen);
  if (view === 'setup') { $('status').innerHTML = pills(['No game']); return renderSetup(); }
  $('status').innerHTML = pills([`${g.players.length} player${g.players.length > 1 ? 's' : ''}`, `${g.mode.replace('Mode', '')} mode`]);
  if (view === 'scenario') return renderScenarioChoice();
  const st = typeof g.status === 'string' ? g.status : g.status.contents === undefined ? g.status.tag : g.status.tag + ': ' + g.status.contents;
  const phase = g.phase === 'SetupPhase' ? 'Setup' : g.phase.replace(/Phase$/, ' phase');
  const phaseColor = PHASE_BANNERS[g.phase]?.[1];
  $('status').innerHTML = pills([
    state.scenarios.find(sc => sc.code === g.scenario)?.name ?? g.scenario,
    ...(g.round > 0 ? [`Round ${g.round}`] : []),
    phaseColor ? { text: phase, cls: 'phase', color: phaseColor } : phase,
    ...(st === 'InProgress' ? [] : [st]),
  ]);

  // the dice sit with the tested player's question, just under the answers
  const t = g.test;
  const testHtml = t ? testBox(g, t) : '';
  // a roll outside a test (rule 474) that the open question depends on: show the dice with it
  const lastLine = g.log[g.log.length - 1] ?? '';
  const loose = t ? null : (/^Rolled (\d+)$/.exec(lastLine)?.slice(1) ?? /^Rolled (\d+) and (\d+) \(\d+\)$/.exec(lastLine)?.slice(1, 3));
  const rollHtml = loose ? `<div class="loose-roll">Rolled ${loose.map(v => `<span class="die">${v}</span>`).join('')}</div>` : '';
  const testPid = t ? g.players.find(p => p.investigator === t.investigator)?.id : null;
  const qs = Object.entries(g.questions);
  const testPlaced = qs.some(([pid]) => +pid === testPid);
  const asker = pid => {
    const iid = g.players.find(x => String(x.id) === String(pid))?.investigator;
    if (!iid) return `<span>Player ${pid}</span>`;
    return `<img class="inv-tok asker" src="/img/ah3e/investigators/${iid}/token.webp" title="${esc(invName(iid))}"
      data-initials="${esc(initials(iid))}" onerror="invFallback(this)"><span>${esc(invName(iid))}</span>`;
  };
  $('questions').innerHTML = (testPlaced ? '' : testHtml) + (qs.length ? qs.map(([pid, q]) =>
    // a spawning monster sits to the left of the question bar
    `${spawningHtml(q) ? `<div class="q-row">${spawningHtml(q)}` : ''}<div class="q"><div class="prompt">${asker(pid)}<span>${esc(q.prompt)}</span></div>${rollHtml}` +
    q.choices.map((c, i) => {
      const t = labelTarget(c.label);
      const hl = t ? ` data-hl="${t}"` : '';
      // a test asset toggles in and out of the dice pool; show which way it is set now
      const toggle = (c.messages ?? []).find(m => m.tag === 'ToggleTestAsset');
      const pressed = toggle ? (g.test?.chosenAssets ?? []).includes(toggle.contents) : null;
      const cls = `${c.label.tag === 'DoneLabel' ? '' : 'primary'}${pressed ? ' chosen' : ''}`;
      const aria = pressed === null ? '' : ` aria-pressed="${pressed}"`;
      return `<button class="${cls}"${hl}${aria} onclick="choose(${pid},${i})">${pressed ? '\u2713 ' : ''}${labelHtml(c.label)}</button>`;
    }).join('') + (+pid === testPid ? testHtml : '') + '</div>' + (spawningHtml(q) ? '</div>' : '')
  ).join('') : '<em>No open questions.</em>');

  const invs = Object.values(g.investigators);
  const activation = i => {
    const leader = g.players.find(p => p.investigator === i.id)?.id === g.leader;
    return tok(`${leader ? 'first-player' : 'activation'}-${i.active ? 'active' : 'inactive'}`, null, `${leader ? 'Leader, ' : ''}${i.active ? 'active' : 'inactive'}`, 40);
  };
  const assetCard = cid => {
    const a = g.assets[cid] ?? {};
    const badges = (a.damage ? tok('damage', a.damage, `${a.damage} damage`, 26) : '') + (a.horror ? tok('horror', a.horror, `${a.horror} horror`, 26) : '');
    const name = state.cardNames[cid] ?? cid;
    const src = cardFace(cid, a.flipped);
    const back = a.flipped ? (a.owner ?? '') : '';
    const inTest = (g.test?.chosenAssets ?? []).includes(cid);
    return `<div class="asset zoomable${inTest ? ' in-test' : ''}" data-card="${cid}" title="${esc(name)}${inTest ? ' (used in this test)' : ''} — click to enlarge" onclick="zoomCard('${src}', '${back}')"><img src="${src}" alt="${esc(name)}" onerror="backFallback(this, '${back}')"><span class="asset-name">${esc(name)}</span>${inTest ? '<span class="in-test-tag">In test</span>' : ''}${badges ? `<div class="asset-badges">${badges}</div>` : ''}</div>`;
  };
  const playerArea = i => {
    const def = state.investigatorDefs?.[i.id];
    // a Map Skill Int arrives as [[skill, n], ...], not as an object keyed by skill
    const focusPairs = Array.isArray(i.focus) ? i.focus : Object.entries(i.focus ?? {});
    const focus = focusPairs.filter(([, v]) => v > 0).map(([k, v]) =>
      `<span class="sheet-focus" style="top:${SKILL_ROWS[k] * 100}%">${tok(FOCUS[k] ?? 'focus-lore', v, `${k} focus`, 30)}</span>`).join('');
    const statusText = i.status !== 'Playing' ? `<span class="pa-status">${esc(i.status)}</span>` : '';
    return `<div class="player-area ${i.status !== 'Playing' ? 'out' : ''} ${g.turn === i.id ? 'turn' : ''}">
      <div class="sheet zoomable" title="Click to enlarge" onclick="zoomFlip('/img/ah3e/investigators/${i.id}/front.webp', '/img/ah3e/investigators/${i.id}/back.webp', 1134 / 900)"><img src="/img/ah3e/investigators/${i.id}/front.webp" alt="${esc(invName(i.id))}" onerror="hideBroken(this)">
        <div class="sheet-text"><b>${esc(invName(i.id))}</b>${def ? `<i>${esc(def.occupation)}</i><p>${esc(def.abilityText)}</p><p>Health ${def.health} · Sanity ${def.sanity} · Focus limit ${def.focusLimit ?? '—'}</p><p>${Object.entries(def.skills).map(([k, v]) => `${esc(k)} ${v}`).join(' · ')}</p>` : ''}</div>
        ${focus}</div>
      <div class="pa-side">
        <div class="pa-head">${activation(i)}<img class="standee ${i.delayed ? 'delayed' : ''}" src="/img/ah3e/investigators/${i.id}/standee.webp" alt="" onerror="this.remove()">
          <div><div class="pa-name">${esc(invName(i.id))}${g.turn === i.id ? ' <span class="pa-turn">taking a turn</span>' : ''}</div>
          <div class="pa-where">${esc(i.space ? spaceName(i.space) : '—')}${i.delayed ? ' · delayed' : ''}</div>${actionPips(g, i)}${statusText}</div></div>
        <div class="toks">${[
          ['damage', i.damage, `${i.damage} damage`, 'DebugSetDamage'],
          ['horror', i.horror, `${i.horror} horror`, 'DebugSetHorror'],
          ['money', i.money, `$${i.money}`, 'DebugSetMoney'],
          ['clue', i.clues, `${i.clues} clues`, 'DebugSetClues'],
          ['remnant', i.remnants, `${i.remnants} remnants`, 'DebugSetRemnants'],
        ].map(([n, v, title, tag]) =>
          `<span class="dbg-tokwrap">${tok(n, v, title, 34, true)}${dbgOn() ? dbgNum(tag, i.id, v, title) : ''}</span>`).join('')}</div>
        ${dbgOn() ? `<div class="dbg-inline">${DBG_SKILLS.map(sk => {
          const v = (focusPairs.find(([k]) => k === sk) ?? [sk, 0])[1];
          return `<span class="dbg-tokwrap">${tok(FOCUS[sk] ?? 'focus-lore', v, `${sk} focus`, 28, true)}<input class="dbg-num"
            type="number" min="0" value="${v}" title="${sk} focus"
            onchange="debugAction('DebugSetFocus', ['${i.id}', '${sk}', +this.value])"></span>`;
        }).join('')}
          <label><input type="checkbox" ${i.delayed ? 'checked' : ''}
            onchange="debugAction('DebugSetDelayed', ['${i.id}', this.checked])">delayed</label>
          <span class="dbg-gain"><input placeholder="card code" value="${esc(dbgCodeValue)}"
            oninput="dbgCodeValue = this.value"><button
            onclick="debugAction('DebugGainCard', ['${i.id}', dbgCodeValue.trim()])">Gain</button></span></div>` : ''}
        ${engagedHtml(g, i)}
        <div class="pa-cards">${i.assets.map(assetCard).join('') || '<em class="waiting">No possessions</em>'}</div>
      </div></div>`;
  };
  $('investigators').innerHTML = invs.length ? playerTabs(g, invs, playerArea) : '<em>None yet.</em>';

  const monsters = Object.values(g.monsters);
  const eventBefore = eventRects();
  renderMap(g, invs, monsters);
  renderActiveToken(g);
  renderActiveCard(g);
  renderDecks(g);
  const discarded = flyDiscardedEvent(g, eventBefore);
  renderScenarioSheet(g);
  applyHighlight();
  applyMoveDrag(g);
  if (animateDraws) flyDrawnCards(g, drawBefore, discarded);
  else lastDrawGame = g;
  const rumorHtml = g.rumor ? rumorCard(g.rumor) : '';
  $('codexCards').innerHTML = g.codex.length || rumorHtml ? g.codex.map(codexCard).join('') + rumorHtml : '<em class="waiting">Empty</em>';
  $('codex').innerHTML = '' +
    `<div class="cup"><span>Mythos cup (${g.cup.length})</span>${g.cup.map(t => mythosTok(t, 32)).join('')}</div><div class="cup"><span>Drawn</span>${g.drawnTokens.map(t => mythosTok(t, 32)).join('') || '—'}</div>`;

  renderLog(g.log);
  markReckonings(g);
  $('raw').textContent = JSON.stringify(g, null, 1);
}

// a reckoning resolves one source at a time; mark every source still waiting,
// so the whole set is visible without hunting through the choices
function markReckonings(g) {
  document.querySelectorAll('.reckoning-pending').forEach(e => e.classList.remove('reckoning-pending'));
  for (const q of Object.values(g.questions ?? {}))
    for (const c of q.choices ?? []) {
      if (c.label?.tag !== 'SourceLabel') continue;
      const t = sourceTarget(c.label.contents);
      if (!t) continue;
      const [kind, id] = t.split(':');
      document.querySelectorAll(`[data-${kind}]`).forEach(e => {
        if (e.getAttribute(`data-${kind}`) === id) e.classList.add('reckoning-pending');
      });
    }
}
refresh();
</script>
