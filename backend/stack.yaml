---
require-stack-version: ">= 3.7.1"
concurrent-tests: true
system-ghc: true
install-ghc: false
resolver: nightly-2026-08-09
compiler: ghc-9.14.1
notify-if-nix-on-path: false

# Build-memory notes (measured on a cold 6830-module arkham-api build):
#
#   * -c in the RTS block below compacts the oldest generation in place instead
#     of copying it. GHC's live set here is only ~1.5G, but a copying major GC
#     needs that much again as to-space, so this roughly halves the footprint
#     for ~1% of wall time.
#   * -fwrite-if-simplified-core and -fprefer-byte-code deliberately are NOT in
#     $locals. They embed simplified Core in every .hi so Template Haskell can
#     run from byte-code; at this module count that cost 490M of interface
#     files vs 256M without (Arkham/Matcher/Window.hi alone was 77M, now 0.2M)
#     and pushed peak GHC residency to 8.8G vs 5.0G, for no wall-time gain.
#     Don't re-add them without re-measuring.
#   * -fwrite-if-compression stays at 1; level 3 was slower AND used more
#     memory, because the extra deduplication tables outweigh the smaller .hi.
ghc-options:
  "$targets":       -j +RTS -A128M -n4m -c -RTS
  "$locals":
    -O0
    -fno-write-ide-info
    -hiedir=.hie
    -fhide-source-paths
    -fignore-optim-changes
    -fwrite-if-compression=1
    -Weverything
    -Wno-unused-packages
    -Wno-missing-exported-signatures
    -Wno-missed-specialisations
    -Wno-all-missed-specialisations
    -Wno-unsafe
    -Wno-safe
    -Wno-missing-local-signatures
    -Wno-monomorphism-restriction
    -Wno-missing-kind-signatures
    -Wno-missing-import-lists
    -Wno-missing-export-lists
    -Wno-incomplete-uni-patterns
    -Wno-partial-fields
    -Wno-implicit-prelude
    -Wno-deriving-typeable
    -Wno-missing-safe-haskell-mode
    -Wno-missing-role-annotations
    -Wno-term-variable-capture
    -Wno-missing-poly-kind-signatures
    -Wno-pattern-namespace-specifier

packages:
  - cards-discover
  - arkham-api
  - validate

allow-newer: true

extra-deps:
- github: halogenandtoast/monad-validate
  commit: e5f36d4a82875c09c6000fed8f8ced50e21b75ce
- github: brendanhay/amazonka
  # b562aa3 migrates amazonka-core from `memory` to `ram`, required by the
  # crypton-1.1.x that nightly-2026-08-09 ships.
  commit: b562aa3f24845e34b95748daae671860017426be
  subdirs:
    - lib/amazonka
    - lib/amazonka-core
    - lib/services/amazonka-sso
    - lib/services/amazonka-sts
    - lib/services/amazonka-s3
- yesod-test-1.6.19@sha256:faac869ab6fa86113cde99d28928e196373a04879c03204071956954ed7ba2a3,3003
- mailtrap-0.1.2.2@sha256:06c8f2711d639ddee59ec914e6963dca7402ea6afd39c75487bbd205b044281a,847
