         the bundle or on the app stylesheet having arrived. The glyph outlines

        inset: 0;

        animation: al-throb 1.7s ease-in-out infinite;

        #app-loading .al-token { animation: al-fade 2.4s ease-in-out infinite; }

      }
    </style>
